# XcodeGen spec for the on-device harness.
#
# An Xcode project exists here for one reason: tool-hosted (hostless) XCTest
# bundles cannot run on a device destination — xcodebuild refuses with "Select
# a host application for the test target". SwiftPM cannot declare a test host,
# so the package alone can reach the simulator and never the iPad.
#
# The project is GENERATED rather than committed: a pbxproj is unreviewable,
# and everything that decides the build is visible in this file instead.
#
# The host app is deliberately empty. The test bundle links the xcframework
# itself rather than inheriting it from the host, so there is exactly one copy
# of the static library in the graph and no duplicate-symbol question.
#
# SEVERAL test bundles, because a bundle is the process boundary and memory
# does not come back. The gallery's volume bake at cell_size 0.015 with a 0.12 band
# costs +75 MB against sdf_consolidate's +6 MB, measured, and the allocator
# does not return it to the OS when the document is destroyed — RSS plateaus
# rather than falling. So the gallery's high-water mark became the floor every
# later test ran above, and testEveryVerbOnDevice was killed by jetsam at
# case 46-53 while passing on its own. Splitting the bundles gives the gallery
# its own process, and its peak dies with it.
#
# Shared/ holds what both bundles need. A type cannot live in one bundle and be
# referenced from the other, and compiling a test class into both would run it
# twice — which is why SceneBuilder and Fixture live there rather than beside
# the cases that used to own them.

name: ClayCoreDevice

options:
  bundleIdPrefix: com.cyberdyne.claycore
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Overridable from the command line; see tools/run_device_bench.sh.
    DEVELOPMENT_TEAM: 2C69VJZSNR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ClayCoreDeviceHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdyne.claycore.devicehost
        GENERATE_INFOPLIST_FILE: NO

  ClayCoreDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    dependencies:
      # Builds the host before the bundle that loads into it.
      - target: ClayCoreDeviceHost
      # The static-library xcframework. `embed: false` because a static
      # library is linked, not embedded — embedding it would produce an
      # invalid bundle.
      - framework: ../../dist/claycore.xcframework
        embed: false
      # A static library records no dependency on the frameworks its objects
      # reference, and every slice now bundles the Metal backend.
      - sdk: Metal.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdyne.claycore.devicetests
        # A signed bundle needs an Info.plist; the test bundle has nothing
        # worth stating in one, so let Xcode generate it.
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClayCoreDeviceHost.app/ClayCoreDeviceHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: -lc++

  # The latency cases, alone in a process and FIRST in the run.
  #
  # ALONE, because a process keeps its high-water mark. testEveryVerbOnDevice
  # passed by itself and was killed by jetsam whenever anything ran ahead of
  # it: each earlier test's peak became its floor. Splitting only the gallery
  # out was not enough — the parity and latency classes set a floor too, and
  # eventually these latency cases set one high enough to kill the verb suite
  # that used to share this bundle. It now has its own, below.
  #
  # FIRST, because splitting the run into bundles serialises it and the tail is
  # measured on a hotter device. Measured rather than assumed: moving the
  # parity bundle from third to first took sdf_stamp_cpu from 14.988 ms back to
  # 5.618, and sdf_stamp_bricks from 6.506 to 3.065, against 5.829 and 3.099
  # before the split. Same commit, same fixtures — only the position moved.
  #
  # That swing is 2.7x on a gate whose regression tolerance is 1.4x, and BOTH
  # runs recorded thermalState nominal at each end, so the harness's own
  # throttle guard cannot see it. ProcessInfo.thermalState is four coarse
  # levels and the device throttles well inside `nominal`. Ordering makes the
  # numbers CONSISTENT; it does not make them thermally neutral, and anything
  # that later changes the run's length or order moves them again.
  #
  # So LatencyTests lives here rather than beside the parity checks: it is a
  # latency case, and everything the gate budgets has to sit in the cold part
  # of the window. What stays in ClayCoreDeviceTests is parity and API checks,
  # which no budget reads, and the gallery makes pictures.
  #
  # Adding a case HERE lengthens the window every verb case is measured in.
  # That is not free and it is not visible in this file's own numbers: it is
  # what eventually pushed the verb suite over jetsam. Re-read the note on
  # ClayCoreDeviceVerbTests before adding another.
  ClayCoreDeviceMeasureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Measure
      - path: Shared
    dependencies:
      - target: ClayCoreDeviceHost
      - framework: ../../dist/claycore.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdyne.claycore.devicemeasure
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClayCoreDeviceHost.app/ClayCoreDeviceHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: -lc++

  # The 62 verb cases, alone in a process and SECOND in the run.
  #
  # Split out of ClayCoreDeviceMeasureTests when `testEveryVerbOnDevice` was
  # killed by jetsam at v0.73.0's gate, having passed at v0.60.0's. Nothing
  # about the case changed: VerbCases.swift is byte-identical across that
  # range. What changed is that seven latency cases were added AHEAD of it in
  # the same process (#380, #381, #385, #396), and this file already records
  # why that is fatal — "each earlier test's peak became its floor". The case
  # died at 0 seconds, before its first measurement, and ran the full 164 s
  # when `-only-testing` gave it the process to itself. That is the whole
  # diagnosis: a floor, not an engine regression.
  #
  # This is the THIRD time this case has hit jetsam — after the gallery's bake
  # and after the batched walk that `walkWindow` bounds — and the first two
  # were fixed the same way this one is. Splitting is the standing remedy
  # because a process boundary is the only thing that actually returns the
  # high-water mark.
  #
  # SECOND, deliberately, and this is the part not to "tidy" later. Within the
  # old single process XCTest ran LatencyTests before VerbLatencyTests
  # (alphabetical), so every one of the 62 committed baselines was recorded
  # with the latency cases ahead of it. Keeping this bundle second preserves
  # that thermal position and changes exactly one thing — the heap. Promoting
  # it to first would hand it a colder window than its baseline was taken in
  # and make the gate quietly lenient; this file's own 2.7x measurement is
  # what that costs.
  ClayCoreDeviceVerbTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Verb
      - path: Shared
    dependencies:
      - target: ClayCoreDeviceHost
      - framework: ../../dist/claycore.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdyne.claycore.deviceverb
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClayCoreDeviceHost.app/ClayCoreDeviceHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: -lc++

  ClayCoreDeviceGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Gallery
      - path: Shared
    dependencies:
      - target: ClayCoreDeviceHost
      - framework: ../../dist/claycore.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdyne.claycore.devicegallery
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClayCoreDeviceHost.app/ClayCoreDeviceHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: -lc++

schemes:
  ClayCoreDevice:
    build:
      targets:
        ClayCoreDeviceHost: all
        ClayCoreDeviceTests: [test]
        ClayCoreDeviceMeasureTests: [test]
        ClayCoreDeviceVerbTests: [test]
        ClayCoreDeviceGalleryTests: [test]
    test:
      targets:
        # The measurement bundle runs FIRST and in its own process, so the
        # numbers the gate reads are taken on a clean heap. The others follow
        # in whatever order; each is its own process, so none inherits another's
        # high-water mark.
        - ClayCoreDeviceMeasureTests
        - ClayCoreDeviceVerbTests
        - ClayCoreDeviceGalleryTests
        - ClayCoreDeviceTests
