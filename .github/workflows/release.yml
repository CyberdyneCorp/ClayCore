name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  checklist:
    name: release checklist (all gates)
    runs-on: ubuntu-latest
    steps:
      # Full history: the device gate compares HEAD against the commit its
      # recorded run names, and a depth-1 clone cannot resolve that commit at
      # all. The gate reports it honestly ("cannot diff... shallow clone?") and
      # fails rather than passing on a claim it cannot check — which is right,
      # and which made this workflow unable to pass until the checkout stopped
      # being shallow. v0.27.0 is the tag that found it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tooling
        # Pinned, and pinned to the SAME version ci.yml uses. Floating on
        # @latest here meant a green CI run did not predict a green release:
        # openspec 1.10.0 added a task-numbering check that 1.8.0 does not
        # have, so v0.39.0's tag build failed a gate no pull request had ever
        # run. A release is the worst place to discover a new lint.
        run: |
          npm install -g @fission-ai/openspec@1.8.0
          python -m pip install --upgrade pip pytest numpy
      - name: Run the release checklist
        run: python3 tools/release_check.py

  wheels:
    name: wheels (${{ matrix.os }})
    needs: checklist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  kernels:
    name: kernels artifact (host GPU previews)
    needs: checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the fixture's reference values come from the CPU scalar path, so the
      # artifact needs a built clay-cli — see docs/06-host-gpu-previews.md
      - name: Build clay-cli
        run: |
          cmake --preset cpu-only -DCLAY_BUILD_TESTS=OFF
          cmake --build --preset cpu-only --target clay_cli
      - name: Package + verify
        run: |
          python3 tools/package_kernels.py --clay build/cpu-only/clay
          python3 tools/package_kernels.py --verify
          cd dist && zip -qry claycore-kernels.zip claycore-kernels
      - uses: actions/upload-artifact@v4
        with:
          name: kernels
          path: dist/claycore-kernels.zip

  xcframework:
    name: xcframework (SwiftPM binary target)
    needs: checklist
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/claycore.xcframework
        run: ./tools/build_xcframework.sh
      - name: Swift smoke (macOS slice, and inside the iOS Simulator)
        run: ./tools/check_swift_smoke.sh all
      - name: SwiftPM package resolves and runs
        run: swift run claycore-smoke
      - name: Package
        run: |
          cd dist && zip -qry claycore.xcframework.zip claycore.xcframework
          swift package compute-checksum claycore.xcframework.zip > claycore.xcframework.checksum
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: |
            dist/claycore.xcframework.zip
            dist/claycore.xcframework.checksum

  draft-release:
    name: draft GitHub release
    needs: [wheels, xcframework, kernels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release with every artifact attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft --generate-notes \
            --title "claycore ${GITHUB_REF_NAME}" \
            $(find artifacts -type f \( -name '*.whl' -o -name '*.zip' -o -name '*.checksum' \))
