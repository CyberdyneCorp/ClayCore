name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  checklist:
    name: release checklist (all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tooling
        run: |
          npm install -g @fission-ai/openspec@latest
          python -m pip install --upgrade pip pytest numpy
      - name: Run the release checklist
        run: python3 tools/release_check.py

  wheels:
    name: wheels (${{ matrix.os }})
    needs: checklist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  xcframework:
    name: xcframework (SwiftPM binary target)
    needs: checklist
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/claycore.xcframework
        run: ./tools/build_xcframework.sh
      - name: Swift smoke (macOS slice, and inside the iOS Simulator)
        run: ./tools/check_swift_smoke.sh all
      - name: SwiftPM package resolves and runs
        run: swift run claycore-smoke
      - name: Package
        run: |
          cd dist && zip -qry claycore.xcframework.zip claycore.xcframework
          swift package compute-checksum claycore.xcframework.zip > claycore.xcframework.checksum
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: |
            dist/claycore.xcframework.zip
            dist/claycore.xcframework.checksum

  draft-release:
    name: draft GitHub release
    needs: [wheels, xcframework]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release with every artifact attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft --generate-notes \
            --title "claycore ${GITHUB_REF_NAME}" \
            $(find artifacts -type f \( -name '*.whl' -o -name '*.zip' -o -name '*.checksum' \))
