name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build+test (${{ matrix.os }}, cpu-only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset cpu-only
      - name: Build
        run: cmake --build --preset cpu-only
      - name: Test
        run: ctest --preset cpu-only
      - name: Validate FBX export with assimp (independent implementation)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q assimp-utils
          assimp info build/cpu-only/tests/io_sample.fbx
          assimp info build/cpu-only/tests/io_sample.obj
          assimp info build/cpu-only/tests/io_sample.ply
      - name: C ABI FFI check (hygiene + ctypes)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/check_c_abi.py build/cpu-only/libclay_shared.so
      # the artifact a host GPU preview consumes: kernel headers verbatim plus
      # the parity fixture it asserts against (docs/06-host-gpu-previews.md)
      - name: Package the kernels artifact
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/package_kernels.py --clay build/cpu-only/clay
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: claycore-kernels
          path: dist/claycore-kernels
      - name: Validate GLB with the official Khronos glTF validator
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --silent gltf-validator
          node tools/validate_gltf.js build/cpu-only/clay_selftest.glb

  metal:
    name: build+test (macos, +metal, parity)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset metal
      - name: Build
        run: cmake --build --preset metal
      - name: Test (Metal parity runs when the runner exposes a Metal device)
        run: ctest --test-dir build/metal --output-on-failure -C Release
      # the only runner that can compile the headers as REAL MSL — including
      # the worked example the kernels artifact ships to host apps
      - name: Kernel dialect (native Metal profile)
        run: python3 tools/check_kernel_dialect.py

  sanitizers:
    name: ASan + UBSan (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan
      - name: Test
        run: ctest --preset asan-ubsan

  checks:
    name: layering, kernel dialect, licenses, binding parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Module layering
        run: python3 tools/check_layering.py
      # includes the emulated Metal profile: the kernel headers are published
      # for host shaders, so an MSL-only break must fail here and not wait for
      # the macOS job
      - name: Kernel dialect
        run: python3 tools/check_kernel_dialect.py --compiler g++
      - name: Kernels artifact (headers copy out and compile standalone)
        run: |
          python3 tools/package_kernels.py
          python3 tools/package_kernels.py --verify
      - name: License manifest
        run: python3 tools/check_licenses.py
      # no build here, so the gate reads pyclay's surface out of its nanobind
      # registrations; the pytest suite runs the same gate against the built
      # module, and the two readings must agree
      - name: Binding parity (C ABI vs pyclay)
        run: python3 tools/check_binding_parity.py

  deps-pins:
    name: dependency pins resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with all dependencies
        run: cmake --preset cpu-only -DCLAY_FETCH_ALL_DEPS=ON

  # OpenCL and CUDA no longer run here.
  #
  # Neither runner has the hardware that would make the test mean what its name
  # says. The CUDA job compiled with nvcc against no device, so it proved
  # codegen and nothing about execution; the OpenCL job ran parity against
  # pocl, which is a CPU implementation — it exercised the OpenCL *plumbing*
  # but its arithmetic was the CPU's, so agreement was close to tautological.
  # Both cost minutes on every push to re-confirm what the dialect gate already
  # checks statically: check_kernel_dialect.py compiles every kernel header
  # under the CPU, CUDA and Metal profiles plus the OpenCL amalgamation, so a
  # dialect break still fails here, on every runner, in seconds.
  #
  # What genuinely goes away is the nvcc *build* of the backend (and its
  # architecture auto-detection), and the check that the OpenCL backend
  # registers at runtime. Those need real devices, and docs/RELEASE.md already
  # carries them as manual, hardware-dependent checks to run before a release
  # that touches kernels.

  python:
    name: pyclay (build, pytest, wheel install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest numpy
      - name: Configure + build with pyclay
        run: |
          cmake --preset cpu-only -DCLAY_BUILD_PYTHON=ON
          cmake --build --preset cpu-only
      - name: Test (unit + C ABI + CLI + pytest)
        run: ctest --preset cpu-only
      - name: Wheel install smoke (scikit-build-core)
        run: |
          python -m pip install .
          python -c "
          import numpy as np, pyclay as clay
          doc = clay.Document()
          body = doc.add_sdf_layer('body')
          body.add(clay.Sphere(r=1.0), color='#38a6cf')
          body.add(clay.Box(size=(0.8, 0.8, 0.8), position=(0.9, 0, 0)), blend=clay.Smooth(0.2))
          d = doc.eval(np.array([[0, 0, 0], [3, 0, 0]], dtype=np.float32))
          assert d[0] < 0 and d[1] > 0, d
          m = doc.mesh(resolution=64)
          assert m.is_watertight()
          print('wheel smoke OK:', clay.backends(), len(m.positions), 'verts')
          "
      # The wheel is tagged abi3, so it must import on an interpreter other
      # than the one that built it. Building and testing on 3.12 alone cannot
      # see a module that landed as pyclay.cpython-312-<plat>.so instead of
      # pyclay.abi3.so — which is exactly how a version-locked build shipped
      # under an abi3 tag once already.
      - name: Set up a second interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: abi3 wheel imports on a different interpreter
        run: |
          python3.12 -m pip wheel . -w dist --no-deps
          ls dist/*.whl
          python3.13 -m venv /tmp/abi3check
          /tmp/abi3check/bin/pip install numpy dist/*.whl
          /tmp/abi3check/bin/python -c "
          import sys, numpy as np, pyclay as clay
          doc = clay.Document()
          doc.add_sdf_layer('b').add(clay.Sphere(r=1.0))
          assert doc.eval(np.zeros((1, 3), dtype=np.float32))[0] < 0
          print('abi3 wheel imports on', sys.version.split()[0])
          "

  examples:
    name: examples (gallery runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy only
        # Examples must run against a bare wheel: pyclay + numpy + stdlib.
        # Installing nothing else is what enforces the no-dependency rule.
        run: python -m pip install --upgrade pip numpy
      - name: Build pyclay
        run: |
          cmake --preset cpu-only -DCLAY_BUILD_PYTHON=ON
          cmake --build --preset cpu-only
      - name: Run every example
        run: PYTHONPATH=build/cpu-only/bindings/python python examples/run_all.py
      - name: Committed gallery is up to date with the code
        # Renders are float output, so bytes can differ across platforms. The
        # gate is that everything runs and produces files, not pixel equality;
        # regenerated outputs are discarded here.
        run: git checkout -- examples/output || true

  benchmarks:
    name: benchmarks + regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset cpu-only -DCLAY_BUILD_BENCHMARKS=ON -DCLAY_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build --preset cpu-only --target clay_bench
      - name: Run + gate
        run: |
          ./build/cpu-only/clay_bench --benchmark_format=json --benchmark_min_time=0.2s > bench.json
          python3 tools/check_bench.py bench.json

  openspec:
    name: openspec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all --strict
