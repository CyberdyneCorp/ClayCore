name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build+test (${{ matrix.os }}, cpu-only)
    strategy:
      fail-fast: false
      # Windows was dropped deliberately, not by accident: it was the only
      # MSVC coverage in this workflow, so an MSVC-only break now lands
      # silently until someone builds there. The library still claims to
      # build on Windows (docs/05), and nothing in CI checks that claim.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset cpu-only
      - name: Build
        run: cmake --build --preset cpu-only
      - name: Test
        run: ctest --preset cpu-only
      - name: Validate FBX export with assimp (independent implementation)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q assimp-utils
          assimp info build/cpu-only/tests/io_sample.fbx
          assimp info build/cpu-only/tests/io_sample.obj
          assimp info build/cpu-only/tests/io_sample.ply
          # The quad exports, through the same independent implementation.
          # A four-index polygon is structurally fine in all three formats, so
          # the writers are where a quad bug hides; our own readers agreeing
          # with our own writers would not find one.
          #
          # What this proves is that an independent parser READS the files —
          # assimp triangulates on import, so it reports triangles and cannot
          # show that the faces stayed quads. That half is asserted against the
          # bytes in tests/unit/test_quad_mesh.cpp.
          assimp info build/cpu-only/tests/quad_sample.fbx
          assimp info build/cpu-only/tests/quad_sample.obj
          assimp info build/cpu-only/tests/quad_sample.ply
          assimp info build/cpu-only/tests/quad_sample_faces.fbx
          assimp info build/cpu-only/tests/quad_sample_faces.obj
          assimp info build/cpu-only/tests/quad_sample_faces.ply
      - name: C ABI FFI check (hygiene + ctypes)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/check_c_abi.py build/cpu-only/libclay_shared.so
      # the artifact a host GPU preview consumes: kernel headers verbatim plus
      # the parity fixture it asserts against (docs/06-host-gpu-previews.md)
      - name: Package the kernels artifact
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/package_kernels.py --clay build/cpu-only/clay
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: claycore-kernels
          path: dist/claycore-kernels
      - name: Validate GLB with the official Khronos glTF validator
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --silent gltf-validator
          node tools/validate_gltf.js build/cpu-only/clay_selftest.glb
          # A quad mesh exported to GLB is TRIANGLES — glTF 2.0 has no quad
          # primitive mode — and it still has to conform.
          node tools/validate_gltf.js build/cpu-only/tests/quad_sample.glb

  metal:
    name: build+test (macos, +metal, parity)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset metal
      - name: Build
        run: cmake --build --preset metal
      - name: Test (Metal parity runs when the runner exposes a Metal device)
        run: ctest --test-dir build/metal --output-on-failure -C Release
      # A skipped gate and a passing gate look identical in a log, which is
      # how "parity runs when the runner exposes a Metal device" stayed
      # unchecked. Report what was actually compared. Absent Metal is a
      # WARNING rather than a failure: this runner may genuinely have no GPU,
      # and the release-time device gate is what establishes Metal parity.
      - name: Report whether Metal parity actually ran
        run: |
          # stderr is where the Metal backend explains itself when it will
          # not register, so it is kept rather than discarded — discarding it
          # is why three release attempts reported "no Metal backend" without
          # ever saying why.
          ./build/metal/tests/clay_unit_tests -tc="*report which backends*" \
            > /tmp/backends.out 2> /tmp/backends.err || true
          echo "--- backend diagnostics (stderr) ---"
          cat /tmp/backends.err || true
          echo "------------------------------------"
          checked=$(sed -n 's/^PARITY_BACKENDS_CHECKED: //p' /tmp/backends.out)
          echo "backends compared on this runner: ${checked:-<none>}"
          case "$checked" in
            *metal*) echo "Metal parity ran here." ;;
            *) echo "::warning::Metal parity was SKIPPED — no Metal backend registered on this runner (compared: ${checked:-none}). Metal parity is established by the release-time device gate, tools/run_device_bench.sh." ;;
          esac
      # the only runner that can compile the headers as REAL MSL — including
      # the worked example the kernels artifact ships to host apps
      - name: Kernel dialect (native Metal profile)
        run: python3 tools/check_kernel_dialect.py
      # Swift used to compile only in the release workflow, so anything that
      # broke tests/swift/smoke.swift passed every PR and failed on the tag —
      # which is exactly what happened to v0.24.0. Type-checking needs the
      # header alone, no xcframework, so it costs seconds here; building and
      # RUNNING the smoke against the real slices stays release-time.
      - name: Swift smoke type-check (clay.h is consumable from Swift)
        run: ./tools/check_swift_smoke.sh typecheck
      # The only runner with a Swift toolchain, so the only one where this gate
      # reads the product's linkage out of SwiftPM rather than out of the
      # manifest text. It also runs in the Linux gates job, weaker, so a
      # contributor without Xcode still gets the signal.
      - name: SwiftPM product linkage (#112)
        run: python3 tools/check_swift_package.py

  # The OLDEST AppleClang still on a hosted runner, and the row that catches
  # what the rest of this matrix cannot: issue #71 was C++20 parenthesized
  # aggregate initialisation (P0960) of math::Aabb, which every newer clang in
  # this workflow accepts and AppleClang 15 rejects — so it built green here
  # and failed in a consumer's submodule on their macos-14 rows. This job
  # compiles the whole tree (library AND tests, where most of the #71 sweep's
  # sites lived) with Xcode 15.4's AppleClang 1500, so that class of
  # regression fails on the PR instead of downstream.
  #
  # The Xcode is pinned rather than taken as the image default so the gate
  # does not silently move when the image's default does.
  #
  # macos-14 is deprecated and retires on November 2nd, 2026, with brownout
  # windows through October (actions/runner-images#13518). When the label
  # dies, note before deleting the job: macos-15's oldest image Xcode is 16.0,
  # whose clang (LLVM 17 based) ACCEPTS P0960 — selecting an old Xcode there
  # is not a replacement gate. The replacement is whatever oldest toolchain
  # consumers still build with at that time.
  # MSVC is the only toolchain in the matrix that reports C4267 (size_t
  # narrowing) and C4702 (unreachable code), and CLAY_WERROR is ON by default,
  # so /WX turns both into build failures. Until this job existed nothing built
  # on Windows before a TAG did — the wheels are release-only — so an MSVC-only
  # break passed every pull request and failed the release. v0.39.0 hit that
  # twice in a row, in src/voxel/grid.cpp and include/clay/kernel/tape.h, then
  # again in src/mesh/sculpt.cpp, each discovered a whole tag-and-rebuild cycle
  # apart because a compile stops at its first errors and only reveals what it
  # reached.
  #
  # Deliberately cmake rather than cibuildwheel: the failures are COMPILE
  # failures, and the preset reproduces /WX exactly at a fraction of the cost.
  # The wheel itself stays release-only.
  windows:
    name: build+test (windows-latest, MSVC /WX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset cpu-only
      - name: Build (the gate — every TU must compile clean under /W4 /WX)
        run: cmake --build --preset cpu-only --config Release
      - name: Test
        run: ctest --preset cpu-only -C Release

  appleclang15:
    name: build+test (macos-14, AppleClang 15 — oldest gated toolchain)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode 15.4 (AppleClang 1500)
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          clang++ --version
      - name: Configure
        run: cmake --preset cpu-only
      - name: Build (the gate — every TU must compile on AppleClang 15)
        run: cmake --build --preset cpu-only
      - name: Test
        run: ctest --preset cpu-only

  release-config:
    # The configuration tools/release_check.py builds, on Linux. Nothing else in
    # this matrix builds it: the ubuntu job uses the cpu-only preset, while the
    # checklist turns benchmarks AND python on, which is more translation units
    # and more peak memory. That gap cost v0.52.1 -- the checklist's build was
    # forking a compile per ready target and the runner killed it, and no PR
    # could have shown that because no PR built this.
    name: build (release checklist config, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure exactly as the checklist does
        run: >
          cmake -S . -B build/relcheck -DCMAKE_BUILD_TYPE=Release
          -DCLAY_BUILD_BENCHMARKS=ON -DCLAY_BUILD_PYTHON=ON
      - name: Build (the gate — this configuration only ever ran on a tag)
        run: cmake --build build/relcheck --parallel $(nproc)

  manylinux:
    # The toolchain the RELEASE wheels are built with, and until v0.52.0 the only
    # compiler in the matrix that nothing exercised before a tag. GCC 12 raised
    # three -Werror=restrict errors in src/io/handoff.cpp that no other compiler
    # here raises, and they were found by the wheels job AFTER v0.52.0 was tagged,
    # which is the fourth time a tag-only gate has cost a release cycle.
    # Build only: this container has no test fixtures, and the gate is "every TU
    # compiles clean under the wheel toolchain".
    name: build (manylinux gcc-toolset-12 — the wheel toolchain)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64:2024.10.07-1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          source /opt/rh/gcc-toolset-12/enable
          g++ --version | head -1
          cmake -S . -B build/manylinux -DCMAKE_BUILD_TYPE=Release
      - name: Build (the gate — every TU must compile clean under GCC 12 -Werror)
        run: |
          source /opt/rh/gcc-toolset-12/enable
          cmake --build build/manylinux -j

  sanitizers:
    name: ASan + UBSan (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan
      - name: Test
        run: ctest --preset asan-ubsan

  # ThreadSanitizer, and it exists because a whole class of this library's
  # guarantees has no other gate. The C ABI promises that any number of threads
  # may run clay_brick_cache_eval_requests and clay_eval_points against one
  # const document at once (clay.h, THREADING), and the resumed brick refill
  # now copies its seeds out and drops cache_mutex_ before it evaluates (#348).
  # Revert that copy and the values a refill returns are still RIGHT -- the
  # concurrency test's assertions pass, doctest reports SUCCESS -- while a raw
  # pointer into a hash map another thread may rehash is live across the
  # unlock. Nothing but a race detector can tell those two apart, so without
  # this job the fix ships with no standing regression guard.
  #
  # RelWithDebInfo, not Debug as the ASan job uses: races are timing-dependent,
  # so the build worth racing is the optimised one, and TSan's own slowdown on
  # top of a Debug build would put the suite past what a PR should cost. It
  # runs the WHOLE suite rather than the new case alone -- everything else
  # threaded in the tree (the pool, the tape cache's readers, the brick-mesh
  # attribute pass) has been in the same position as the refill was, exercised
  # concurrently and never checked for races. Measured 6 min on a 24-thread
  # desktop, clean: 1501/1501, zero TSan warnings.
  #
  # setarch -R DISABLES ASLR for the run, and it is not optional. TSan maps
  # fixed shadow regions, and a kernel handing out mappings with more entropy
  # than it expects -- which Ubuntu 24.04 does, vm.mmap_rnd_bits=32 -- aborts
  # the process with "FATAL: ThreadSanitizer: unexpected memory mapping" before
  # a single test runs. It exits 66, so ctest does fail the job rather than
  # passing it silently, but the log says nothing about a race and the job
  # would be a gate on nothing. `sudo sysctl -w vm.mmap_rnd_bits=28` is the
  # other fix; setarch needs no privilege and applies to the child processes
  # ctest spawns, which is what has to be de-randomised.
  thread-sanitizer:
    name: ThreadSanitizer (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan
      - name: Test (ASLR off — see the note above)
        run: setarch -R ctest --preset tsan

  checks:
    name: layering, kernel dialect, licenses, binding parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Module layering
        run: python3 tools/check_layering.py
      # includes the emulated Metal profile: the kernel headers are published
      # for host shaders, so an MSL-only break must fail here and not wait for
      # the macOS job
      - name: Kernel dialect
        run: python3 tools/check_kernel_dialect.py --compiler g++
      - name: Kernels artifact (headers copy out and compile standalone)
        run: |
          python3 tools/package_kernels.py
          python3 tools/package_kernels.py --verify
      - name: License manifest
        run: python3 tools/check_licenses.py
      # no build here, so the gate reads pyclay's surface out of its nanobind
      # registrations; the pytest suite runs the same gate against the built
      # module, and the two readings must agree
      - name: Binding parity (C ABI vs pyclay)
        run: python3 tools/check_binding_parity.py
      # No Swift toolchain here, so this reads Package.swift as text; the macOS
      # job runs the same gate authoritatively. Both, because the failure it
      # guards shipped for four releases and cost every Xcode 26 consumer a
      # wall of undefined symbols.
      - name: SwiftPM product linkage (#112)
        run: python3 tools/check_swift_package.py

  # READ THE NAME. This job gates the Vulkan backend's PLUMBING — that the
  # generated GLSL compiles, that the SPIR-V is valid, that descriptors bind,
  # that dispatches run and that results read back — and it gates NOTHING about
  # arithmetic.
  #
  # lavapipe is Mesa's software rasteriser: it executes our SPIR-V on the CPU
  # with LLVM. So when the parity suite passes here it has compared the CPU
  # reference against the CPU, and agreement is close to tautological. That is
  # exactly the trap the OpenCL job fell into with pocl, which is why it was
  # removed (see the comment above) and why this job's name says "plumbing"
  # rather than "parity". Vulkan arithmetic on a real device is a manual,
  # hardware-dependent release check in docs/RELEASE.md.
  #
  # What it genuinely catches, and what nothing else does: a kernel change that
  # produces GLSL the shim's Vulkan profile no longer compiles, a descriptor or
  # push-constant layout that stopped matching the shader, a dispatch split that
  # loses elements, and a backend that silently stops registering.
  vulkan-plumbing:
    name: vulkan plumbing (lavapipe; NOT an arithmetic gate)
    runs-on: ubuntu-latest
    env:
      # lavapipe is a software device; the loader otherwise warns per dispatch.
      MESA_VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE: "1"
      # Force the Khronos validation layer on. The backend creates its instance
      # with enabledLayerCount = 0 — it is a library and does not get to decide
      # its host's debug policy — so the layer is injected by the LOADER here.
      # Both spellings are set: VK_LOADER_LAYERS_ENABLE is the current one and
      # VK_INSTANCE_LAYERS is what older loaders read, and which of the two a
      # runner image ships is not something to leave to chance.
      VK_LOADER_LAYERS_ENABLE: "VK_LAYER_KHRONOS_validation"
      VK_INSTANCE_LAYERS: "VK_LAYER_KHRONOS_validation"
    steps:
      - uses: actions/checkout@v4
      - name: Install the Vulkan loader, headers, glslang and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            mesa-vulkan-drivers vulkan-tools spirv-tools
      # Pin the loader to lavapipe rather than hoping it is the only ICD: a
      # runner that grows a second one must not silently change what ran.
      # Discovered rather than hardcoded — Mesa packages the manifest as
      # lvp_icd.json on some distributions and lvp_icd.<arch>.json on others,
      # and a path that is merely wrong would leave the loader to pick for
      # itself, which is the silent outcome this pin exists to prevent.
      - name: Pin the loader to lavapipe
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "::error::mesa-vulkan-drivers is installed but no lavapipe ICD manifest was found"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "using $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      # Object-lifetime tracking is what makes this job evidence about the
      # device-adoption ownership rule: an adopted device the library wrongly
      # destroys, or one it wrongly keeps, shows up here and nowhere else.
      # Core validation covers it, but naming it means a future default change
      # cannot quietly drop it.
      - name: Turn on validation, with object lifetimes
        run: |
          cat > "$GITHUB_WORKSPACE/vk_layer_settings.txt" <<'SETTINGS'
          khronos_validation.validate_core = true
          khronos_validation.object_lifetime = true
          khronos_validation.stateless_param = true
          khronos_validation.thread_safety = true
          khronos_validation.report_flags = error,warn
          khronos_validation.log_filename = stdout
          SETTINGS
          echo "VK_LAYER_SETTINGS_PATH=$GITHUB_WORKSPACE/vk_layer_settings.txt" >> "$GITHUB_ENV"
      # A job that passes because the LAYER never loaded proves exactly as much
      # as one that passes because the backend never built — which is to say
      # nothing, and it is the failure mode this whole step exists to prevent.
      # So the layer's presence is asserted rather than hoped for.
      - name: The validation layer is actually there
        run: |
          manifest=$(ls /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json 2>/dev/null || true)
          if [ -z "$manifest" ]; then
            echo "::error::vulkan-validationlayers is installed but its manifest was not found"
            ls -la /usr/share/vulkan/explicit_layer.d/ || true
            exit 1
          fi
          vulkaninfo --summary > vkinfo.log 2>&1 || true
          if ! grep -q "VK_LAYER_KHRONOS_validation" vkinfo.log; then
            echo "::error::the loader does not report the validation layer as enabled"
            sed -n '1,80p' vkinfo.log
            exit 1
          fi
          echo "validation layer enabled"
      # `|| true`: the step is informational, and the runner's shell is
      # `bash -eo pipefail`, so a SIGPIPE from truncating the output would fail
      # the job for no reason.
      - name: Show the device the loader picked
        run: vulkaninfo --summary || true
      # With glslang present this stops skipping the Vulkan profile, so a kernel
      # edit that breaks the GLSL branch of shim.h fails per-push. On every
      # other runner this profile is skipped for want of a compiler.
      - name: Kernel dialect, including the Vulkan GLSL profile
        run: |
          python3 tools/check_kernel_dialect.py --compiler g++ 2>&1 | tee dialect.log
          if grep -q "skipping the Vulkan profile" dialect.log; then
            echo "::error::glslang is installed but the Vulkan profile was still skipped"
            exit 1
          fi
      - name: Configure
        run: cmake --preset vulkan
      - name: Build
        run: cmake --build --preset vulkan
      # A job that passes because the backend was never built proves nothing,
      # and that is the failure mode most likely to go unnoticed — so the
      # registration is asserted rather than assumed.
      - name: The backend actually registered
        run: |
          python3 - <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL("build/vulkan/libclay_shared.so")
          lib.clay_list_backends.argtypes = [ctypes.c_char_p,
                                             ctypes.POINTER(ctypes.c_size_t)]
          n = ctypes.c_size_t(0)
          lib.clay_list_backends(None, ctypes.byref(n))
          buf = ctypes.create_string_buffer(n.value)
          lib.clay_list_backends(buf, ctypes.byref(n))
          names = buf.value.decode().split(",")
          print("registered backends:", names)
          if "vulkan" not in names:
              sys.exit("the vulkan backend did not register on lavapipe")
          PY
      # The suite runs whole. Its parity cases DO execute against lavapipe and
      # they are not evidence about a real GPU's arithmetic — see the block
      # above. What they are evidence about is that the whole path from tape to
      # buffer to dispatch to readback works.
      # The layer REPORTS; it does not fail a process. So the run is captured
      # and searched afterwards: a validation error that only printed would be
      # a finding nobody reads, which is the state this job was in while the
      # package was installed and the layer was never switched on.
      - name: Test
        run: |
          set -o pipefail
          ctest --preset vulkan 2>&1 | tee vulkan-tests.log
      - name: No validation errors
        run: |
          if grep -nE "Validation Error|VUID-[A-Za-z0-9_-]+" vulkan-tests.log > violations.log; then
            echo "::error::the Vulkan validation layer reported problems"
            sed -n '1,60p' violations.log
            exit 1
          fi
          echo "no validation errors or warnings"

  deps-pins:
    name: dependency pins resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with all dependencies
        run: cmake --preset cpu-only -DCLAY_FETCH_ALL_DEPS=ON

  # OpenCL and CUDA no longer run here.
  #
  # Neither runner has the hardware that would make the test mean what its name
  # says. The CUDA job compiled with nvcc against no device, so it proved
  # codegen and nothing about execution; the OpenCL job ran parity against
  # pocl, which is a CPU implementation — it exercised the OpenCL *plumbing*
  # but its arithmetic was the CPU's, so agreement was close to tautological.
  # Both cost minutes on every push to re-confirm what the dialect gate already
  # checks statically: check_kernel_dialect.py compiles every kernel header
  # under the CPU, CUDA and Metal profiles plus the OpenCL amalgamation, so a
  # dialect break still fails here, on every runner, in seconds.
  #
  # What genuinely goes away is the nvcc *build* of the backend (and its
  # architecture auto-detection), and the check that the OpenCL backend
  # registers at runtime. Those need real devices, and docs/RELEASE.md already
  # carries them as manual, hardware-dependent checks to run before a release
  # that touches kernels.

  python:
    name: pyclay (build, pytest, wheel install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest numpy
      - name: Configure + build with pyclay
        run: |
          cmake --preset cpu-only -DCLAY_BUILD_PYTHON=ON
          cmake --build --preset cpu-only
      - name: Test (unit + C ABI + CLI + pytest)
        run: ctest --preset cpu-only
      - name: Wheel install smoke (scikit-build-core)
        run: |
          python -m pip install .
          python -c "
          import numpy as np, pyclay as clay
          doc = clay.Document()
          body = doc.add_sdf_layer('body')
          body.add(clay.Sphere(r=1.0), color='#38a6cf')
          body.add(clay.Box(size=(0.8, 0.8, 0.8), position=(0.9, 0, 0)), blend=clay.Smooth(0.2))
          d = doc.eval(np.array([[0, 0, 0], [3, 0, 0]], dtype=np.float32))
          assert d[0] < 0 and d[1] > 0, d
          m = doc.mesh(resolution=64)
          assert m.is_watertight()
          print('wheel smoke OK:', clay.backends(), len(m.positions), 'verts')
          "
      # The wheel is tagged abi3, so it must import on an interpreter other
      # than the one that built it. Building and testing on 3.12 alone cannot
      # see a module that landed as pyclay.cpython-312-<plat>.so instead of
      # pyclay.abi3.so — which is exactly how a version-locked build shipped
      # under an abi3 tag once already.
      - name: Set up a second interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: abi3 wheel imports on a different interpreter
        run: |
          python3.12 -m pip wheel . -w dist --no-deps
          ls dist/*.whl
          python3.13 -m venv /tmp/abi3check
          /tmp/abi3check/bin/pip install numpy dist/*.whl
          /tmp/abi3check/bin/python -c "
          import sys, numpy as np, pyclay as clay
          doc = clay.Document()
          doc.add_sdf_layer('b').add(clay.Sphere(r=1.0))
          assert doc.eval(np.zeros((1, 3), dtype=np.float32))[0] < 0
          print('abi3 wheel imports on', sys.version.split()[0])
          "

  examples:
    name: examples (gallery runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy only
        # Examples must run against a bare wheel: pyclay + numpy + stdlib.
        # Installing nothing else is what enforces the no-dependency rule.
        run: python -m pip install --upgrade pip numpy
      - name: Build pyclay
        run: |
          cmake --preset cpu-only -DCLAY_BUILD_PYTHON=ON
          cmake --build --preset cpu-only
      - name: Run the reference host session
        # Same bare wheel environment as the gallery, and deliberately BEFORE
        # it: the session takes about a second and the gallery takes half an
        # hour, so a broken binding surfaces here rather than 27 minutes in.
        run: PYTHONPATH=build/cpu-only/bindings/python python reference/host_loop.py
      - name: Run every example
        # CLAY_EXAMPLES_FAST renders at half resolution per axis and caps
        # occlusion rays. This job's gate is that every example RUNS and
        # produces files -- the outputs are discarded on the next step because
        # float renders differ across platforms -- so quality here buys
        # nothing and costs about an hour. 41/41 in 97s instead of 543s.
        run: |
          CLAY_EXAMPLES_FAST=1 \
          PYTHONPATH=build/cpu-only/bindings/python python examples/run_all.py
      - name: Committed gallery is up to date with the code
        # Renders are float output, so bytes can differ across platforms. The
        # gate is that everything runs and produces files, not pixel equality;
        # regenerated outputs are discarded here.
        run: git checkout -- examples/output || true

  benchmarks:
    name: benchmarks + regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset cpu-only -DCLAY_BUILD_BENCHMARKS=ON -DCLAY_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build --preset cpu-only --target clay_bench
      - name: Run + gate
        run: |
          ./build/cpu-only/clay_bench --benchmark_format=json --benchmark_min_time=0.2s > bench.json
          python3 tools/check_bench.py bench.json

  openspec:
    name: openspec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @fission-ai/openspec@1.8.0
      - run: openspec validate --all --strict
